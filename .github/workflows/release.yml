name: Publish Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify signing secrets
        env:
          DAYLOG_KEYSTORE_BASE64: ${{ secrets.DAYLOG_KEYSTORE_BASE64 }}
          DAYLOG_KEYSTORE_PASSWORD: ${{ secrets.DAYLOG_KEYSTORE_PASSWORD }}
          DAYLOG_KEY_ALIAS: ${{ secrets.DAYLOG_KEY_ALIAS }}
          DAYLOG_KEY_PASSWORD: ${{ secrets.DAYLOG_KEY_PASSWORD }}
        run: |
          test -n "$DAYLOG_KEYSTORE_BASE64"
          test -n "$DAYLOG_KEYSTORE_PASSWORD"
          test -n "$DAYLOG_KEY_ALIAS"
          test -n "$DAYLOG_KEY_PASSWORD"

      - name: Restore signing key
        env:
          DAYLOG_KEYSTORE_BASE64: ${{ secrets.DAYLOG_KEYSTORE_BASE64 }}
        run: echo "$DAYLOG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/daylog-release.jks"

      - name: Build signed APK
        env:
          DAYLOG_KEYSTORE_FILE: ${{ runner.temp }}/daylog-release.jks
          DAYLOG_KEYSTORE_PASSWORD: ${{ secrets.DAYLOG_KEYSTORE_PASSWORD }}
          DAYLOG_KEY_ALIAS: ${{ secrets.DAYLOG_KEY_ALIAS }}
          DAYLOG_KEY_PASSWORD: ${{ secrets.DAYLOG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk DayLog.apk
          sha256sum DayLog.apk > DayLog.apk.sha256

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose DayLog.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" DayLog.apk DayLog.apk.sha256 --verify-tag --generate-notes --title "DayLog $GITHUB_REF_NAME"
